name: ls

# Fixed equal-task weighting (Linear Scalarization) + MAdam preconditioning.
# This keeps the optimizer as Adam/SGD while applying MAdam-style
# preconditioned gradients through method hooks.
task_weights: null

fim_method: madam
fim_ema_decay: 0.999
fim_eps_damp: 1e-8
fim_eps_num: 1e-12
fim_clip_grad_norm: 0.0
fim_bias_correction: false
fim_stochastic_pairs: true
exclude_bn_from_fim: null
