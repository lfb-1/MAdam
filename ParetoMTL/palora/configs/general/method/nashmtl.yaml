name: nashmtl
max_norm: 1.0
max_norm_clip_order: before_madam
update_weights_every: 1
optim_niter: 20
solver: ECOS
max_solver_failure_rate: null
min_solver_attempts_before_failure: 100
fim_method: none
fim_lambda_policy: aggregation_raw
fim_preserve_shared_grad_norm: false
fim_solver_geometry: raw
fim_ema_decay: 0.999
fim_eps_damp: 1.0e-6
fim_eps_num: 1.0e-12
fim_stochastic_pairs: true
fim_bias_correction: false
fim_clip_grad_norm: 0.0
exclude_bn_from_fim: null
exclude_head_from_fim: null
