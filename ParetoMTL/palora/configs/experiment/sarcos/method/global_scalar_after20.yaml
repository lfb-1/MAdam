name: ls

# MAdam denominator frozen after 20% training and collapsed to one global scalar.
task_weights: null

fim_method: madam
fim_ablation_name: scalar20
fim_eps_damp: 1e-8
fim_eps_num: 1e-12
fim_ema_decay: 0.999
fim_clip_grad_norm: 0.0
fim_bias_correction: false
fim_stochastic_pairs: true
fim_start_fraction: 0.0
fim_end_fraction: 1.0
fim_freeze_after_fraction: 0.2
fim_reduce_denom: global
fim_normalize_denom_mean: false
exclude_bn_from_fim: null
