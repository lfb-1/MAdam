[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "madam-core"
version = "0.1.0"
description = "Shared MAdam/FIM preconditioning core for the MAdam repository"
requires-python = ">=3.9"
dependencies = ["torch"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
